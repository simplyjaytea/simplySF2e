name: sf2e drift

# The module hard-codes the sf2e pack collection ids it reads. A system update
# that renames or drops one makes those lookups fail quietly, so check weekly
# and open a single tracking issue when an expected pack disappears.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Exit 1 means a pack the module reads is gone (file an issue).
      # Exit 2 means the manifest could not be read (infrastructure; no issue).
      - name: Compare expected pack ids with the live sf2e manifest
        id: check
        run: |
          set -o pipefail
          rm -f drift.txt
          set +e
          node tools/drift-check.mjs | tee drift.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Record the result
        if: always()
        run: |
          {
            echo "## sf2e drift"
            echo ""
            echo '```'
            cat drift.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the drift issue
        if: failure() && steps.check.outputs.code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = fs.existsSync('drift.txt')
              ? fs.readFileSync('drift.txt', 'utf8').trim()
              : '(the check produced no output)';
            const title = 'sf2e drift: an expected compendium pack is missing';
            const body = [
              'The weekly sf2e drift check failed. The module reads pack ids that the live system manifest no longer lists, so those lookups now fail silently.',
              '',
              '```',
              report,
              '```',
              '',
              `Run (${context.runId}): ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            const { owner, repo } = context.repo;
            // Dedupe by title: a label may be missing or silently dropped when
            // an installation token creates an issue.
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = open.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: 'sf2e-drift' });
              } catch {
                await github.rest.issues.createLabel({
                  owner, repo, name: 'sf2e-drift', color: 'd93f0b',
                  description: 'Weekly sf2e compendium pack drift'
                });
              }
              await github.rest.issues.create({ owner, repo, title, body, labels: ['sf2e-drift'] });
            }
