name: sf2e drift

# The module hard-codes the sf2e pack collection ids it reads. A system update
# that renames or drops one makes those lookups fail quietly, so check weekly
# and open a single tracking issue when an expected pack disappears.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compare expected pack ids with the live sf2e manifest
        id: check
        run: |
          set -o pipefail
          rm -f drift.txt
          node tools/drift-check.mjs | tee drift.txt

      - name: Record the result
        if: always()
        run: |
          {
            echo "## sf2e drift"
            echo ""
            echo '```'
            cat drift.txt 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the drift issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = fs.existsSync('drift.txt')
              ? fs.readFileSync('drift.txt', 'utf8').trim()
              : '(the check produced no output)';
            const title = 'sf2e drift: an expected compendium pack is missing';
            const body = [
              'The weekly sf2e drift check failed. The module reads pack ids that the live system manifest no longer lists, so those lookups now fail silently.',
              '',
              '```',
              report,
              '```',
              '',
              `Run (${context.runId}): ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'sf2e-drift', per_page: 10
            });
            if (open.data.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ['sf2e-drift'] });
            }
