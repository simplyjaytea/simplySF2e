name: Release

# Publishes Foundry-installable assets. Three ways to ship an update; every
# path runs syntax + regression checks before a release is created:
#
#   1. Push a tag like v0.1.1. The workflow creates the GitHub release
#      itself and attaches assets.
#   2. Actions -> Release -> "Run workflow", enter a version like 0.1.1.
#      Same as above, without needing a local checkout.
#   3. Called as a reusable workflow (workflow_call, with a "version" input)
#      by auto-release.yml on every merge to main. Reusable-workflow calls
#      run in the SAME workflow-run graph as their caller, so this is the
#      only one of the three paths a workflow can trigger on another
#      workflow's behalf — a tag pushed BY a workflow using the default
#      GITHUB_TOKEN does NOT fire this workflow's own `push: tags` trigger
#      (GitHub suppresses event-triggered runs started by GITHUB_TOKEN, to
#      stop infinite trigger loops), so auto-release.yml can't just push a
#      tag and rely on path 1 — it has to call in via this path instead.
#
# The manifest URL advertised to users never changes:
#   https://github.com/simplyjaytea/simplySF2e/releases/latest/download/module.json
# GitHub's "latest/download" redirect always serves the newest release, so the
# install link in the README keeps working forever. (It only resolves once at
# least one release exists.) Each release's module.json gets its `download`
# pinned to that specific version, which lets Foundry offer updates and lets
# users roll back to old versions if needed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.1 (the tag becomes v0.1.1)"
        required: true
        type: string
      channel:
        description: "stable = every install updates; beta = only installs using the beta manifest"
        required: true
        default: stable
        type: choice
        options: [stable, beta]
  workflow_call:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.1 (the tag becomes v0.1.1)"
        required: true
        type: string
      channel:
        description: "stable or beta (auto-release.yml passes beta)"
        required: false
        default: beta
        type: string

permissions:
  contents: write

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate release JSON
        run: jq empty module.json lang/en.json

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find scripts -type f -name '*.mjs' -print0 | sort -z)
          if (( ${#files[@]} == 0 )); then
            echo "No .mjs files found under scripts/" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Run regression checks
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find scripts -type f -name '*.test.mjs' -print0 | sort -z)
          if (( ${#tests[@]} == 0 )); then
            echo "No regression checks found under scripts/" >&2
            exit 1
          fi
          for test_file in "${tests[@]}"; do
            echo "Running $test_file"
            node "$test_file"
          done

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Determine release tag and channel
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          # A pushed v* tag has no inputs: treat it as a stable release.
          CHANNEL="${INPUT_CHANNEL:-stable}"
          if [[ "$CHANNEL" != "stable" && "$CHANNEL" != "beta" ]]; then
            echo "Invalid channel: $CHANNEL (expected stable or beta)" >&2
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          # Branch on whether a "version" input was actually supplied, NOT on
          # github.event_name — inside a workflow_call'd run, event_name is
          # the CALLER's original triggering event (e.g. "push" for
          # auto-release.yml), not "workflow_call", so an event_name check
          # falls through to $GITHUB_REF_NAME here and picks up the pushing
          # BRANCH name ("main") instead of a version. Confirmed live: this
          # is exactly what shipped a release tagged "main" before this fix.
          if [ -n "$INPUT_VERSION" ]; then
            TAG="v${INPUT_VERSION#v}"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))+$ ]]; then
            echo "Invalid release tag: $TAG (expected v1.2.3 or another numeric dotted version without leading zeroes)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Stamp version and download URL into module.json
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          VERSION="${TAG#v}"
          # Stable installs follow releases/latest, which GitHub never points
          # at a pre-release. Beta installs follow the rolling "beta" release.
          if [[ "$CHANNEL" == "beta" ]]; then
            MANIFEST="https://github.com/${GITHUB_REPOSITORY}/releases/download/beta/module.json"
          else
            MANIFEST="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/module.json"
          fi
          jq --arg version "$VERSION" \
             --arg manifest "$MANIFEST" \
             --arg download "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.zip" \
             '.version = $version | .manifest = $manifest | .download = $download' \
             module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Build module archive
        shell: bash
        run: |
          set -euo pipefail
          for required_path in module.json LICENSE README.md lang scripts styles templates; do
            if [[ ! -e "$required_path" ]]; then
              echo "Required release path is missing: $required_path" >&2
              exit 1
            fi
          done
          mapfile -t release_files < <(
            printf '%s\n' module.json LICENSE README.md
            find lang scripts styles templates -type f ! -name '*.test.mjs' -print | sort
          )
          zip -q module.zip "${release_files[@]}"
          if unzip -Z1 module.zip | grep -Eq '(^|/)[^/]+\.test\.mjs$'; then
            echo "Regression test files must not be shipped in module.zip" >&2
            exit 1
          fi

      - name: Stage verified release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
        run: |
          PRERELEASE=()
          [[ "$CHANNEL" == "beta" ]] && PRERELEASE=(--prerelease)
          set -euo pipefail
          git fetch --tags --force
          EXISTING_TARGET=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)
          if [[ -n "$EXISTING_TARGET" && "$EXISTING_TARGET" != "$GITHUB_SHA" ]]; then
            echo "Tag $TAG already targets $EXISTING_TARGET, not verified commit $GITHUB_SHA" >&2
            exit 1
          fi
          if RELEASE_JSON=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,targetCommitish 2>/dev/null); then
            IS_DRAFT=$(jq -r '.isDraft' <<<"$RELEASE_JSON")
            RELEASE_TARGET=$(jq -r '.targetCommitish // empty' <<<"$RELEASE_JSON")
            if [[ "$IS_DRAFT" != "true" && "$IS_DRAFT" != "false" ]]; then
              echo "Could not determine whether release $TAG is a draft" >&2
              exit 1
            fi
            if [[ "$IS_DRAFT" == "true" && "$RELEASE_TARGET" != "$GITHUB_SHA" ]]; then
              echo "Draft release $TAG targets $RELEASE_TARGET, not verified commit $GITHUB_SHA" >&2
              exit 1
            fi
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" module.json module.zip --clobber
          else
            gh release create "$TAG" module.json module.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              --draft \
              "${PRERELEASE[@]}"
          fi

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          CHANNEL: ${{ steps.tag.outputs.channel }}
        # Let GitHub choose Latest automatically by version/date. Forcing
        # --latest here would let an older manual publish or rerun replace the
        # update manifest served from releases/latest/download/module.json.
        # A beta stays a pre-release, so it can never become Latest.
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "beta" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false
          fi

      - name: Refresh the rolling beta channel
        # The beta manifest URL never changes:
        #   https://github.com/<repo>/releases/download/beta/module.json
        # It is served from a pre-release tagged "beta" whose assets are
        # replaced on every beta publish. Its module.json points `download`
        # at the versioned zip, so a beta install always gets an exact build.
        # The "beta" tag is not a version tag, so auto-release.yml's version
        # bump ignores it.
        if: steps.tag.outputs.channel == 'beta'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view beta --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Move the "beta" tag to this build so the release's source
            # archive matches its assets (gh release edit cannot move a tag).
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/beta" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload beta --repo "$GITHUB_REPOSITORY" module.json module.zip --clobber
            gh release edit beta --repo "$GITHUB_REPOSITORY" --prerelease --title "Beta channel (now $TAG)"
          else
            gh release create beta module.json module.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Beta channel (now $TAG)" \
              --notes "Rolling beta channel. Install with the manifest URL https://github.com/${GITHUB_REPOSITORY}/releases/download/beta/module.json to get every merge before it reaches stable."
          fi
